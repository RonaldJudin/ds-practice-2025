syntax = "proto3";

package transaction_verification;

service TransactionVerificationService {
    rpc InitOrder (InitOrderRequest) returns (InitOrderResponse);
    rpc VerifyTransaction (TransactionVerificationRequest) returns (TransactionVerificationResponse);
    rpc VerifyBookList (TVRequest) returns (VerifyBookListResponse);
    rpc VerifyUserData (TVRequest) returns (VerifyUserDataResponse);
    rpc VerifyCreditCardFormat (TVRequest) returns (VerifyCreditCardFormatResponse);
}

message InitOrderRequest {
    string order_id = 1;
    repeated Book items = 2;
    User user = 3;
    CreditCard credit_card = 4;
    string user_comment = 5;
    Address billing_address = 6;
    string shipping_method = 7;
    bool gift_wrapping = 8;
    bool terms_accepted = 9;
}

message InitOrderResponse {
    string order_id = 1;
}

message TransactionVerificationRequest {
    string order_id = 1;
    repeated string items = 2;
    User user = 3;
    CreditCard credit_card = 4;
    string user_comment = 5;
    Address billing_address = 6;
    string shipping_method = 7;
    bool gift_wrapping = 8;
    bool terms_accepted = 9;
}

message TransactionVerificationResponse {
    bool is_verified = 1;
    map<string, int32> vector_clock = 2;
}

message TVRequest {
    string order_id = 1;
    map<string, int32> vector_clock = 2;
}

message VerifyBookListResponse {
    bool is_verified = 1;
    map<string, int32> vector_clock = 2;
}

message VerifyUserDataResponse {
    bool is_verified = 1;
    map<string, int32> vector_clock = 2;
}

message VerifyCreditCardFormatResponse {
    bool is_verified = 1;
    map<string, int32> vector_clock = 2;
}

message Book {
    string name = 1;
    int32 quantity = 2;
}

message User {
    string name = 1;
    string email = 2;
}

message CreditCard {
    string number = 1;
    string expiration_date = 2;
    string cvv = 3;
}

message Address {
    string street = 1;
    string city = 2;
    string state = 3;
    string zip = 4;
    string country = 5;
}