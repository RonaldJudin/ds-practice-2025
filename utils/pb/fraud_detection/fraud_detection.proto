syntax = "proto3";

package fraud_detection;

service HelloService {
    rpc SayHello (HelloRequest) returns (HelloResponse);
}

service FraudDetectionService {
    rpc InitOrder (InitOrderRequest) returns (InitOrderResponse);
    rpc CheckFraud (FraudDetectionRequest) returns (FraudDetectionResponse);
    rpc CheckCreditCard (CreditCardRequest) returns (CreditCardResponse);
}

message InitOrderRequest {
    string order_id = 1;
    repeated Book items = 2;
    User user = 3;
    CreditCard credit_card = 4;
    string user_comment = 5;
    Address billing_address = 6;
    string shipping_method = 7;
    bool gift_wrapping = 8;
    bool terms_accepted = 9;
}

message InitOrderResponse {
    string order_id = 1;
}

message HelloRequest {
    string name = 1;
}

message HelloResponse {
    string greeting = 1;
}

message FraudDetectionRequest {
    string order_id = 1;
    map<string, int32> vector_clock = 2;
}

message FraudDetectionResponse {
    bool is_fraudulent = 1;
    map<string, int32> vector_clock = 2;
}

message CreditCardRequest {
    string order_id = 1;
    map<string, int32> vector_clock = 2;
}

message CreditCardResponse {
    bool is_verified = 1;
    map<string, int32> vector_clock = 2;
}

message Book {
    string name = 1;
    int32 quantity = 2;
}

message User {
    string name = 1;
    string email = 2;
}

message CreditCard {
    string number = 1;
    string expiration_date = 2;
    string cvv = 3;
}

message Address {
    string street = 1;
    string city = 2;
    string state = 3;
    string zip = 4;
    string country = 5;
}