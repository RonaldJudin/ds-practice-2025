syntax = "proto3";

package suggestions;

service SuggestionsService {
    rpc GetSuggestions (SuggestionsRequest) returns (SuggestionsResponse);
}

message SuggestionsRequest {
    User user = 1;
    VectorClock vector_clock = 2;
}

message SuggestionsResponse {
    repeated Book suggested_books = 1;
    VectorClock vector_clock = 2;
}

message User {
    string name = 1;
    string email = 2;
}

message Book {
    string bookId = 1;
    string title = 2;
    string author = 3;
}

message VectorClock {
    map<string, int32> clock = 1;
}