syntax = "proto3";

package order_queue;

service OrderQueueService {
    rpc Enqueue (EnqueueRequest) returns (EnqueueResponse);
    rpc Dequeue (DequeueRequest) returns (DequeueResponse);
}

message EnqueueRequest {
    string order_id = 1;
    repeated Book items = 2;
    User user = 3;
    CreditCard credit_card = 4;
    string user_comment = 5;
    Address billing_address = 6;
    string shipping_method = 7;
    bool gift_wrapping = 8;
    bool terms_accepted = 9;
}

message EnqueueResponse {
    string order_id = 1;
}

message DequeueRequest {
    string order_id = 1;
}

message DequeueResponse {
    string order_id = 1;
    repeated Book items = 2;
    User user = 3;
    CreditCard credit_card = 4;
    string user_comment = 5;
    Address billing_address = 6;
    string shipping_method = 7;
    bool gift_wrapping = 8;
    bool terms_accepted = 9;
}

message Book {
    string name = 1;
    int32 quantity = 2;
}

message User {
    string name = 1;
    string email = 2;
}

message CreditCard {
    string number = 1;
    string expiration_date = 2;
    string cvv = 3;
}

message Address {
    string street = 1;
    string city = 2;
    string state = 3;
    string zip = 4;
    string country = 5;
}